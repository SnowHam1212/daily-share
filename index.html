<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: ホーム画面に追加したときフルスクリーン表示になるため、
         ノッチ／ホームバーの下に潜る領域まで描画し、余白は env(safe-area-inset-*) で確保する -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f9384" />
    <meta name="description" content="Daily Share — 仲間と今いる場所とこれからの予定を分かち合う" />

    <!-- ホーム画面に追加できるようにする（#101） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS は manifest の icons を読まないため、専用に指定する -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daily Share" />
    <title>Daily Share — 場所と予定を、仲間と。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
